name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          API_URL: http://localhost:8080
          SITE_URL: http://localhost:3000

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t paradise-view-web .

      - name: Jalankan dan cek health
        run: |
          docker run -d --name web -p 3000:3000 \
            -e API_URL=http://localhost:8080 \
            -e SITE_URL=http://localhost:3000 \
            paradise-view-web
          curl -fsS --retry 20 --retry-delay 2 --retry-connrefused http://localhost:3000/api/health

      - name: Log saat gagal
        if: failure()
        run: docker logs web